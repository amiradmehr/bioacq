# meta-bioacq: BioAcq and its patched BrainFlow for a Yocto image.
# Needs meta (poky) and meta-qt6; see ../README.md.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "bioacq"
BBFILE_PATTERN_bioacq = "^${LAYERDIR}/"
BBFILE_PRIORITY_bioacq = "10"

LAYERDEPENDS_bioacq = "core qt6-layer"
LAYERSERIES_COMPAT_bioacq = "kirkstone nanbield scarthgap styhead walnascar whinlatter"
